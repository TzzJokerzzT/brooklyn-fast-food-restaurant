openapi: 3.0.3
info:
  title: Brooklyn Fast Food Restaurant — API
  description: |
    REST API for the Brooklyn Fast Food Restaurant platform.

    ## Authentication
    Most endpoints require a Bearer token in the `Authorization` header.
    Obtain tokens via the `/auth/login` or `/auth/register` endpoints.

    ## Role Hierarchy
    | Role         | ID | Description                          |
    |-------------|----|--------------------------------------|
    | super-admin | 1  | Full system access                   |
    | admin       | 2  | User management (read/update)        |
    | clients     | 3  | Regular customers (default on signup)|
  version: 0.1.0
  contact:
    name: Brooklyn Fast Food Team

servers:
  - url: http://localhost:3001/api/v1
    description: Local development (v1)
  - url: http://localhost:3001/api
    description: Local development (legacy)

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Registration, login, token refresh, and current user
  - name: Users
    description: User management (admin / super-admin)
  - name: Products
    description: Product management (admin / super-admin)

paths:
  # ── Health ──────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Seconds since server start

  # ── Auth ────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain access + refresh tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using a refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Valid refresh token
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Users ───────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: roleId
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
          description: Filter by role ID
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Create a user (super-admin only)
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserIdParam"

    get:
      tags: [Users]
      summary: Get user by ID (admin or super-admin)
      operationId: getUserById
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Users]
      summary: Update user fields (admin or super-admin)
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Users]
      summary: Delete user (super-admin only)
      operationId: deleteUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Update user role (super-admin only)
      operationId: updateUserRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
                  enum: [1, 2, 3]
                  description: |
                    New role ID:
                    - `1` = super-admin
                    - `2` = admin
                    - `3` = clients (default)
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Enable or disable a user (admin or super-admin)
      operationId: updateUserStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
                  description: Set to `false` to deactivate the account
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Products ───────────────────────────────────────────────
  /products:
    get:
      tags: [Products]
      summary: List products (paginated)
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: search
          in: query
          schema:
            type: string
          description: Search by product name
        - name: isPromotion
          in: query
          schema:
            type: boolean
          description: Filter by promotion status
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "500":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Products]
      summary: Create a product (admin or super-admin)
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [productName, price, ingredients]
              properties:
                productName:
                  type: string
                  minLength: 1
                  example: Classic Burger
                productImage:
                  type: string
                  format: binary
                  description: Product image (max 5MB)
                isPromotion:
                  type: boolean
                  default: false
                price:
                  type: number
                  format: float
                  example: 9.99
                ingredients:
                  type: array
                  items:
                    type: string
                  example: ["beef", "lettuce", "tomato", "cheese"]
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /products/bulk:
    post:
      tags: [Products]
      summary: Create multiple products (admin or super-admin)
      operationId: createManyProducts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Products created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListBulkResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductIdParam"

    get:
      tags: [Products]
      summary: Get product by ID
      operationId: getProductById
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessProductResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Products]
      summary: Update product (admin or super-admin)
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                productName:
                  type: string
                  minLength: 1
                productImage:
                  type: string
                  format: binary
                  description: Product image (max 5MB)
                isPromotion:
                  type: boolean
                price:
                  type: number
                  format: float
                ingredients:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Products]
      summary: Delete product (admin or super-admin)
      operationId: deleteProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /products/bulk:
    delete:
      tags: [Products]
      summary: Delete multiple products (admin or super-admin)
      operationId: deleteManyProducts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        "200":
          description: Products deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 3 products deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

# ════════════════════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════════════════════
components:
  # ── Security Schemes ──────────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token obtained from `/auth/login` or `/auth/register`.
        Send as `Authorization: Bearer <token>`.

  # ── Reusable Parameters ───────────────────────────────────
  parameters:
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: User ID
    ProductIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Product ID
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Items per page

  # ── Reusable Responses ────────────────────────────────────
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Validation error
            errors:
              - field: email
                message: Invalid email format
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: No token provided
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Insufficient permissions
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Not found

  # ── Schemas ───────────────────────────────────────────────
  schemas:
    # ── Request bodies ────────────────────────────────────
    RegisterRequest:
      type: object
      required: [userName, lastName, email, password]
      properties:
        userName:
          type: string
          minLength: 2
          example: John
        lastName:
          type: string
          minLength: 2
          example: Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 6
          description: Min 6 chars, at least one uppercase letter and one number
          example: Secret123
        address:
          type: string
          example: "123 Main St, Brooklyn, NY"
        phoneNumber:
          type: string
          example: "+1-718-555-0100"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    CreateUserRequest:
      type: object
      required: [userName, lastName, email, password, roleId]
      properties:
        userName:
          type: string
          minLength: 2
        lastName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          description: Min 6 chars, at least one uppercase letter and one number
        address:
          type: string
        roleId:
          type: integer
          enum: [1, 2, 3]
          description: |
            Role ID:
            - `1` = super-admin
            - `2` = admin
            - `3` = clients

    UpdateUserRequest:
      type: object
      properties:
        userName:
          type: string
          minLength: 2
        lastName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        address:
          type: string
        roleId:
          type: integer
          enum: [1, 2, 3]

    CreateProductRequest:
      type: object
      required: [productName, price, ingredients]
      properties:
        productName:
          type: string
          minLength: 1
          example: Classic Burger
        isPromotion:
          type: boolean
          default: false
        price:
          type: number
          format: float
          example: 9.99
        ingredients:
          type: array
          items:
            type: string
          example: ["beef", "lettuce", "tomato", "cheese"]

    UpdateProductRequest:
      type: object
      properties:
        productName:
          type: string
          minLength: 1
        isPromotion:
          type: boolean
        price:
          type: number
          format: float
        ingredients:
          type: array
          items:
            type: string

    # ── Response schemas ──────────────────────────────────
    Role:
      type: object
      properties:
        id:
          type: integer
          enum: [1, 2, 3]
        name:
          type: string
          enum: [super-admin, admin, clients]

    User:
      type: object
      properties:
        id:
          type: integer
        userName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"

    Product:
      type: object
      properties:
        id:
          type: integer
        productName:
          type: string
        productImage:
          type: string
          nullable: true
        isPromotion:
          type: boolean
        price:
          type: number
          format: float
        ingredients:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (default 15 min)
        refreshToken:
          type: string
          description: Long-lived JWT (default 7 days)

    SuccessUserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
        message:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            accessToken:
              type: string
            refreshToken:
              type: string
        message:
          type: string
          example: User login success

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AuthTokens"

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/User"
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
        message:
          type: string

    SuccessProductResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            product:
              $ref: "#/components/schemas/Product"
        message:
          type: string

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/Product"
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
        message:
          type: string

    ProductListBulkResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/Product"
            count:
              type: integer
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
